name: build-windows

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t my-qt6-win -f Dockerfile .

      - name: Build Windows app
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/home/user/project" \
            my-qt6-win

      - name: Upload packaged app
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg_capture_recorder-win64
          path: build-win/app-win64.zip
          if-no-files-found: error

      - name: Upload raw deploy folder
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg_capture_recorder-win64-deploy
          path: build-win/deploy
          if-no-files-found: error
