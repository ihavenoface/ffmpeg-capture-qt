name: Build & Pre-Release

on:
  push:
    branches: ["**"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build (cross-compile Windows via Docker)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/home/user/project" \
            stateoftheartio/qt6:6.6-mingw-aqt

      - name: Rename artifact with commit SHA
        run: |
          SHORT="${GITHUB_SHA::7}"
          mv build-win/app-win64.zip "build-win/ffmpeg_capture_recorder-win64-${SHORT}.zip"
          echo "ARTIFACT=build-win/ffmpeg_capture_recorder-win64-${SHORT}.zip" >> "$GITHUB_ENV"

      - name: Create / update nightly pre-release
        uses: ncipollo/release-action@v1
        with:
          tag: nightly
          name: "Nightly Build"
          body: |
            Automated pre-release
            **Commit:** ${{ github.sha }}
            **Branch:** ${{ github.ref_name }}
            **Run:** #${{ github.run_number }}
          artifacts: ${{ env.ARTIFACT }}
          prerelease: true
          allowUpdates: true
          removeArtifacts: true
          token: ${{ secrets.GITHUB_TOKEN }}