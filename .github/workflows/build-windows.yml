name: Build & Pre-Release

on:
  push:
    branches: ["**"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t my-qt6-win .

      - name: Run build
        run: |
          docker run --rm \
            --user root \
            -v "${{ github.workspace }}:/home/user/project" \
            my-qt6-win

      - name: Rename artifact
        run: |
          SHORT="${GITHUB_SHA::7}"
          mv build-win/app-win64.zip "ffmpeg_capture_recorder-win64-${SHORT}.zip"
          echo "ARTIFACT=ffmpeg_capture_recorder-win64-${SHORT}.zip" >> "$GITHUB_ENV"

      - name: Publish pre-release
        uses: ncipollo/release-action@v1
        with:
          tag: nightly
          name: "Nightly Build"
          body: |
            **Commit:** ${{ github.sha }}
            **Branch:** ${{ github.ref_name }}
            **Run:** \#${{ github.run_number }}
          artifacts: ${{ env.ARTIFACT }}
          prerelease: true
          allowUpdates: true
          removeArtifacts: true
          token: ${{ secrets.GITHUB_TOKEN }}